<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Exercice 2 - Grabbing VR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
  <script src="https://unpkg.com/super-hands@^3.0.6/dist/super-hands.min.js"></script>
</head>
<body style="margin:0;">

  <script>
    // Reprend tels quels joystick-move et joystick-turn de l'exercice 1
    // (thumbstickmoved est aussi émis par hand-controls, donc le déplacement
    // continue de fonctionner sans rien changer à cette logique).
    AFRAME.registerComponent('joystick-move', {
      schema: { rig: { type: 'selector' }, speed: { type: 'number', default: 2 } },
      init: function () {
        this.inputX = 0; this.inputY = 0;
        this.el.addEventListener('thumbstickmoved', (evt) => {
          this.inputX = evt.detail.x;
          this.inputY = evt.detail.y;
        });
      },
      tick: function (time, delta) {
        if (!this.data.rig) return;
        const dt = delta / 1000;
        const camera = this.data.rig.querySelector('[camera]');
        if (!camera) return;
        const forward = new THREE.Vector3();
        camera.object3D.getWorldDirection(forward);
        forward.y = 0; forward.normalize();
        const right = new THREE.Vector3();
        right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).negate();
        const move = new THREE.Vector3();
        move.addScaledVector(forward, -this.inputY * this.data.speed * dt);
        move.addScaledVector(right, this.inputX * this.data.speed * dt);
        this.data.rig.object3D.position.add(move);
      }
    });

    AFRAME.registerComponent('joystick-turn', {
      schema: { rig: { type: 'selector' }, turnSpeed: { type: 'number', default: 100 } },
      init: function () {
        this.inputX = 0;
        this.el.addEventListener('thumbstickmoved', (evt) => { this.inputX = evt.detail.x; });
      },
      tick: function (time, delta) {
        if (!this.data.rig || Math.abs(this.inputX) < 0.15) return;
        const dt = delta / 1000;
        const deltaDeg = -this.inputX * this.data.turnSpeed * dt;
        this.data.rig.object3D.rotation.y += THREE.MathUtils.degToRad(deltaDeg);
      }
    });
  </script>

  <a-scene physics="debug: false">

    <!-- Sol visuel -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#7BC8A4" shadow="receive: true"></a-plane>
    <!-- Collision physique du sol : boîte fine non tournée (même technique que le Run & Gun) -->
    <a-box position="0 -0.05 0" width="20" height="0.1" depth="20" visible="false" static-body="shape: box"></a-box>

    <!-- Objets saisissables : dynamic-body (gravité) + grabbable (super-hands) -->
    <a-box position="-1.5 1 -2" color="#4CC3D9" shadow="cast: true; receive: true"
      dynamic-body="shape: box; mass: 1" grabbable></a-box>

    <a-sphere position="1.5 1 -2" radius="0.4" color="#EF2D5E" shadow="cast: true; receive: true"
      dynamic-body="shape: box; mass: 1" grabbable></a-sphere>

    <a-light type="directional" castShadow="true" intensity="0.8" position="-1 3 1"></a-light>
    <a-light type="ambient" color="#888" intensity="0.5"></a-light>

    <a-entity id="rig" position="0 0 3">
      <a-entity camera position="0 1.6 0" look-controls></a-entity>

      <!-- hand-controls remplace le trio oculus-touch/vive/laser de l'exercice 1 :
           il les inclut déjà en interne, tout en ajoutant le modèle de main visuel
           attendu par super-hands pour le grab de près. -->
      <a-entity
        id="leftHand"
        hand-controls="hand: left"
        sphere-collider="objects: [grabbable]"
        super-hands
        joystick-move="rig: #rig">
      </a-entity>

      <a-entity
        id="rightHand"
        hand-controls="hand: right"
        sphere-collider="objects: [grabbable]"
        super-hands
        joystick-turn="rig: #rig">
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
