<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Exercice 1 - SceneVR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body style="margin:0;">

  <script>
    /**
     * Joystick GAUCHE : déplacement avant/arrière/gauche/droite,
     * relatif à la direction regardée par la caméra (comme dans un FPS classique).
     */
    AFRAME.registerComponent('joystick-move', {
      schema: {
        rig: { type: 'selector' },
        speed: { type: 'number', default: 2 } // unités/seconde à pleine amplitude
      },
      init: function () {
        this.inputX = 0;
        this.inputY = 0;
        this.el.addEventListener('thumbstickmoved', (evt) => {
          this.inputX = evt.detail.x; // -1 (gauche) à 1 (droite)
          this.inputY = evt.detail.y; // -1 (avant) à 1 (arrière), selon le mapping du casque
        });
      },
      tick: function (time, delta) {
        if (!this.data.rig) return;
        const dt = delta / 1000;

        const camera = this.data.rig.querySelector('[camera]');
        if (!camera) return;

        // Direction "avant" de la caméra, projetée à l'horizontale (ignore le regard vers le haut/bas)
        const forward = new THREE.Vector3();
        camera.object3D.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();

        const right = new THREE.Vector3();
        right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).negate();

        const move = new THREE.Vector3();
        move.addScaledVector(forward, -this.inputY * this.data.speed * dt);
        move.addScaledVector(right, this.inputX * this.data.speed * dt);

        this.data.rig.object3D.position.add(move);
      }
    });

    /**
     * Joystick DROIT : fait pivoter la vue (rotation autour de l'axe Y du rig).
     */
    AFRAME.registerComponent('joystick-turn', {
      schema: {
        rig: { type: 'selector' },
        turnSpeed: { type: 'number', default: 100 } // degrés/seconde à pleine amplitude
      },
      init: function () {
        this.inputX = 0;
        this.el.addEventListener('thumbstickmoved', (evt) => {
          this.inputX = evt.detail.x;
        });
      },
      tick: function (time, delta) {
        if (!this.data.rig) return;
        if (Math.abs(this.inputX) < 0.15) return; // petite zone morte, évite la dérive au repos

        const dt = delta / 1000;
        const deltaDeg = -this.inputX * this.data.turnSpeed * dt;
        this.data.rig.object3D.rotation.y += THREE.MathUtils.degToRad(deltaDeg);
      }
    });
  </script>

  <a-scene>

    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#7BC8A4" shadow="receive: true"></a-plane>
    <a-box position="-1.5 0.5 -3" color="#4CC3D9" shadow="cast: true; receive: true"></a-box>
    <a-sphere position="1.5 0.75 -3" radius="0.75" color="#EF2D5E" shadow="cast: true; receive: true"></a-sphere>

    <a-light type="directional" castShadow="true" intensity="0.8" position="-1 3 1"></a-light>
    <a-light type="ambient" color="#888" intensity="0.5"></a-light>

    <a-entity id="rig" position="0 0 3">
      <a-entity camera position="0 1.6 0" look-controls></a-entity>

      <!-- Main gauche : déplacement -->
      <a-entity
        id="leftHand"
        hand="left"
        laser-controls="hand: left"
        oculus-touch-controls="hand: left"
        vive-controls="hand: left"
        joystick-move="rig: #rig">
      </a-entity>

      <!-- Main droite : rotation -->
      <a-entity
        id="rightHand"
        hand="right"
        laser-controls="hand: right"
        oculus-touch-controls="hand: right"
        vive-controls="hand: right"
        joystick-turn="rig: #rig">
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
